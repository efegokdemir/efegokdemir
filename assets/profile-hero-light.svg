    <path class="signal" d="M22 185C82 185 82 115 142 115S202 185 262 185" fill="none" stroke="url(#signal)" stroke-width="2" stroke-dasharray="26 94"/>
    <circle cx="22" cy="185" r="5" fill="#f5f3ee" stroke="#b77b00" stroke-width="2"/>
    <circle cx="142" cy="115" r="5" fill="#f5f3ee" stroke="#b77b00" stroke-width="2"/>
    <circle cx="262" cy="185" r="5" fill="#f5f3ee" stroke="#b77b00" stroke-width="2"/>

