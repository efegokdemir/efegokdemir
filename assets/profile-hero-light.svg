  <rect x="72" y="66" width="4" height="188" rx="2" fill="#db9803"/>
  <g fill="#20252b" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="108" y="130" font-size="48" font-weight="700" letter-spacing="-1.6">Efe Gökdemir</text>
    <text x="110" y="170" font-size="20" fill="#9b6900" font-weight="600">Founder @ RexCode</text>
    <text x="110" y="214" font-size="14" fill="#59616b" letter-spacing=".65">SHOPIFY TOOLS  ·  ECOMMERCE SYSTEMS  ·  OPEN SOURCE</text>
    <rect x="110" y="235" width="8" height="2" fill="#b77b00"/>
