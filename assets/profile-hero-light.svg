<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Efe Gökdemir — Founder at RexCode</title>
  <desc id="desc">Shopify tools, ecommerce systems and open source.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0ede6"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b77b00" stop-opacity="0"/>
      <stop offset=".48" stop-color="#b77b00" stop-opacity=".85"/>
      <stop offset="1" stop-color="#b77b00" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .signal { animation: travel 5s linear infinite; }
    .status { animation: breathe 3.6s ease-in-out infinite; transform-origin: 1062px 83px; }
    @keyframes travel { to { stroke-dashoffset: -120; } }
    @keyframes breathe { 0%, 100% { opacity: .42; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .signal, .status { animation: none; } }
  </style>

  <rect width="1200" height="320" rx="18" fill="#f5f3ee"/>
  <g opacity=".72" stroke="#dedbd2" stroke-width="1">
    <path d="M0 64H1200M0 128H1200M0 192H1200M0 256H1200"/>
