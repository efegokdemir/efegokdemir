<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Efe Gökdemir — Founder at RexCode</title>
  <desc id="desc">Shopify and ecommerce software, open source.</desc>

  <style>
    .signal { animation: signal 5s linear infinite; }
    .accent { animation: breathe 3.8s ease-in-out infinite; }
    @keyframes signal { to { stroke-dashoffset: -160; } }
    @keyframes breathe { 0%, 100% { opacity: .72; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .signal, .accent { animation: none; } }
  </style>

  <rect width="1200" height="320" rx="18" fill="#f5f3ee"/>
  <g opacity=".62" stroke="#dedbd2" stroke-width="1">
    <path d="M0 64H1200M0 128H1200M0 192H1200M0 256H1200"/>
    <path d="M80 0V320M160 0V320M240 0V320M320 0V320M400 0V320M480 0V320M560 0V320M640 0V320M720 0V320M800 0V320M880 0V320M960 0V320M1040 0V320M1120 0V320"/>
  </g>

  <rect class="accent" x="88" y="68" width="4" height="184" rx="2" fill="#db9803"/>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="128" y="136" fill="#20252b" font-size="56" font-weight="700" letter-spacing="-1.8">Efe Gökdemir</text>
    <text x="130" y="176" fill="#9b6900" font-size="20" font-weight="600">Founder @ RexCode</text>
    <text x="130" y="220" fill="#59616b" font-size="14" letter-spacing=".75">SHOPIFY &amp; ECOMMERCE SOFTWARE</text>
    <text x="130" y="244" fill="#59616b" font-size="14" letter-spacing=".75">OPEN SOURCE</text>
  </g>

  <path d="M130 270H1070" stroke="#c8c3b8" stroke-width="1"/>
  <path class="signal" d="M130 270H1070" stroke="#b77b00" stroke-width="2" stroke-dasharray="18 142" fill="none"/>
</svg>
